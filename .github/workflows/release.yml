name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true
      - run: go vet ./...
      - run: go test ./... -race -count=1 -cover

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Download Go modules
        run: go mod download

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v', ''
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag"     | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build changelog
        id: changelog
        shell: pwsh
        run: |
          $current = "${{ github.ref_name }}"
          $allTags = @(git tag --sort=-v:refname 2>&1)
          if ($allTags.Count -le 1) {
            $range = $current
          } else {
            $idx = [array]::IndexOf($allTags, $current)
            if ($idx -ge 0 -and $idx -lt ($allTags.Count - 1)) {
              $prev = $allTags[$idx + 1]
              $range = "$prev..$current"
            } else {
              $range = $current
            }
          }
          $log = git log $range --pretty=format:"* %s (%h)" --no-merges --
          $log | Out-File -FilePath CHANGELOG.md -Encoding utf8
          "changelog<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $log              | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Generate Windows application icon
        run: go run ./tools/icon-gen -input build/appicon.png -output build/windows/icon.ico

      - name: Wails build
        env:
          CGO_ENABLED: 0
        run: wails build -clean -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}"

      - name: Prepare artifact
        shell: pwsh
        id: artifact
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $dst = "outline-reader-$tag-windows-amd64.exe"
          $exe = $null
          $candidates = @(
            "build\bin\outline-reader.exe",
            "build\bin\OutlineReader.exe"
          )
          foreach ($c in $candidates) {
            if (Test-Path $c) { $exe = Get-Item $c; break }
          }
          if (-not $exe) {
            $exe = Get-ChildItem "build\bin\*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            $exe = Get-ChildItem "build\*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $exe) {
            Write-Error "No .exe found after wails build."
            exit 1
          }
          Copy-Item $exe.FullName $dst
          "artifact=$dst" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare portable artifact
        id: portable
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $root = "portable\OutlineReader"
          New-Item -ItemType Directory -Force -Path "$root\data" | Out-Null
          Copy-Item "${{ steps.artifact.outputs.artifact }}" "$root\outline-reader.exe"
          Set-Content -Path "$root\data\keep.txt" -Encoding utf8 -Value "Не удаляйте папку: она включает portable-режим, здесь хранятся база и профиль WebView2."
          $zip = "outline-reader-$tag-portable-windows-amd64.zip"
          Compress-Archive -Path $root -DestinationPath $zip -Force
          "portable=$zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Checksums
        shell: pwsh
        run: |
          $files = @("${{ steps.artifact.outputs.artifact }}", "${{ steps.portable.outputs.portable }}")
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            "$h  $f"
          }
          $lines | Out-File -FilePath sha256sums.txt -Encoding ascii

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{ steps.artifact.outputs.artifact }}
            ${{ steps.portable.outputs.portable }}

      - name: Create Release and upload
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.tag }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---
            Установщик не требуется — это один self-contained `.exe`.
            Проверка целостности: `sha256sums.txt` + GitHub artifact attestation.
          files: |
            ${{ steps.artifact.outputs.artifact }}
            ${{ steps.portable.outputs.portable }}
            sha256sums.txt
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}